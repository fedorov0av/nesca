name: nesca-lab

services:
  ssh:
    build: ./ssh
    networks:
      nesca-lab:
        ipv4_address: 172.28.0.2

  http:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      nesca-lab:
        ipv4_address: 172.28.0.3

  ftp:
    image: fauria/vsftpd
    environment:
      FTP_USER: test
      FTP_PASS: test
      PASV_ADDRESS: 172.28.0.4
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110
    networks:
      nesca-lab:
        ipv4_address: 172.28.0.4

  rtsp:
    image: bluenviron/mediamtx:latest
    networks:
      nesca-lab:
        ipv4_address: 172.28.0.5

networks:
  nesca-lab:
    name: nesca-lab
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
